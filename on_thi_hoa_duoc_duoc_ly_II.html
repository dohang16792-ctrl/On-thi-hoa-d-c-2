4", "q": "Thuốc điều trị giun trong lòng ruột:", "opts": ["Diethylcarbamazin citrat", "Albendazol", "Primaqiun phosphat", "Niclosamid"], "key": 1, "shuffle": true}, {"n": 611, "chapter": "Chương 4", "q": "Thuốc điều trị giun trong lòng ruột:", "opts": ["Ivermectin", "Mebendazol", "Quinin hydroclorid", "Niclosamid"], "key": 1, "shuffle": true}, {"n": 612, "chapter": "Chương 4", "q": "Thuốc có tác dụng cắt cơn sốt rét:", "opts": ["Quinin", "Plasmoquin", "Pyrimethamin", "Primaquin"], "key": 0, "shuffle": true}, {"n": 613, "chapter": "Chương 4", "q": "Thuốc có tác dụng cắt cơn sốt rét:", "opts": ["Plasmoquin", "Artemisinin", "Pyrimethamin", "Primaquin"], "key": 1, "shuffle": true}];let current=[],answers={},graded=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let chapters=[...new Set(bank.map(x=>x.chapter))];document.querySelector('#chap').innerHTML=chapters.map(c=>`<option>${esc(c)}</option>`).join('');document.querySelector('#info').textContent=`${bank.length} câu đã đọc được từ tài liệu. Chỉ đảo đáp án khi không có tham chiếu đến vị trí A/B/C/D.`;function start(mode){graded=false;answers={};current=mode==='random'?shuffle(bank).slice(0,50):mode==='chapter'?bank.filter(q=>q.chapter===document.querySelector('#chap').value):[...bank];current=current.map(q=>{let choices=q.opts.map((text,i)=>({text,original:i}));if(mode==='random'&&q.shuffle)choices=shuffle(choices);return {...q,choices}});render();document.querySelector('#results').classList.add('hidden')}function choose(n,i){if(graded)return;answers[n]=i;render()}function render(){document.querySelector('#exam').innerHTML=`<div class="panel"><b>${current.length} câu hỏi</b> · Đã chọn ${Object.keys(answers).length}/${current.length}</div>`+current.map((q,index)=>`<div class="question"><h3>Câu ${q.n}: ${esc(q.q)}</h3>${q.choices.map((o,i)=>`<button class="choice ${answers[q.n]===i?'chosen':''} ${graded&&o.original===q.key?'right':''} ${graded&&answers[q.n]===i&&o.original!==q.key?'wrong':''}" onclick="choose(${q.n},${i})">${String.fromCharCode(65+i)}. ${esc(o.text)}</button>`).join('')}</div>`).join('')+`<div class="panel"><button class="primary" onclick="grade()" ${graded?'disabled':''}>Nộp bài và chấm điểm</button></div>`}function grade(){graded=true;let correct=current.filter(q=>q.choices[answers[q.n]]?.original===q.key).length;render();let wrong=current.filter(q=>q.choices[answers[q.n]]?.original!==q.key);document.querySelector('#score').textContent=`Đúng ${correct}/${current.length} câu · ${Math.round(correct/current.length*100)}%`;document.querySelector('#review').innerHTML='<h2>Các câu sai hoặc chưa làm</h2>'+wrong.map(q=>{let chosen=q.choices[answers[q.n]];let right=q.choices.find(x=>x.original===q.key);return `<p><b>Câu ${q.n}:</b> ${esc(q.q)}<br><span style="color:#bc2525">Đã chọn: ${esc(chosen?.text||'Chưa trả lời')}</span><br><span style="color:#138344">Đúng: ${esc(right?.text||'Không có')}</span></p>`}).join('');document.querySelector('#results').classList.remove('hidden');document.querySelector('#results').scrollIntoView({behavior:'smooth'})}start('all');</script></html>
